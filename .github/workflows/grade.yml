name: grade
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Sandbox repo name"
        required: true
      ref:
        description: "Branch or SHA to grade"
        required: true
      item:
        description: "Item id"
        required: true
      run_id:
        description: "Run id"
        required: true
permissions:
  contents: read
concurrency:
  group: grade-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: validate inputs
        env:
          ITEM: ${{ inputs.item }}
          REPO: ${{ inputs.repo }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$ITEM" =~ ^(B[1-4]|T[1-4])$ ]] || { echo "bad item"; exit 1; }
          [[ "$REPO" =~ ^loop-eval-sbx-[a-z0-9-]+$ ]] || { echo "bad repo"; exit 1; }
          [[ "$RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad run_id"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: harneet2512/loop-eval-grader
          token: ${{ secrets.GH_PAT }}
          path: grader
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: harneet2512/${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}
          path: sbx
          persist-credentials: false
      - id: tc
        env:
          ITEM: ${{ inputs.item }}
        run: bash grader/ci/toolchain.sh "$ITEM"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.tc.outputs.node }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        if: steps.tc.outputs.pnpm == 'true'
        with:
          version: 10.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.tc.outputs.python }}
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        if: steps.tc.outputs.uv == 'true'
      - name: grade
        env:
          ITEM: ${{ inputs.item }}
          SBX_REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          RUN_ID: ${{ inputs.run_id }}
        run: bash grader/ci/grade.sh
      - name: publish grade
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RUN_ID: ${{ inputs.run_id }}
        run: bash grader/ci/publish.sh grade "$RUN_ID"
